<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#131f42">
    <title>Smart Home Kiosk — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #131f42; color: #fff; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(293deg, #131f42, #6a4357 45%, #131f42); }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      img { width: 5rem; height: 5rem; }
      h1 { margin: 1.5rem 0 .5rem; font-size: 1.75rem; }
      p { color: rgba(255,255,255,.75); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.svg" alt="">
      <h1>You're offline</h1>
      <p>The kiosk shell is ready, but live home status and controls need a network connection. Reconnect and reload to continue.</p>
    </main>
  </body>
</html>
